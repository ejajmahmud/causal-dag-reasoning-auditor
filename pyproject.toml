[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-dag-reasoning-auditor"
version = "0.1.0"
description = "Causal directed acyclic graph evaluator verifying counterfactual consistency in agent causal reasoning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
causal-dag-reasoning-auditor = "causal_dag_reasoning_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["causal_dag_reasoning_auditor*"]
